name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - "releases/*.md"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          publish_notes() {
            local tag="$1" create="$2"
            local notes="releases/${tag}.md"

            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            fi
            if [[ ! -f "$notes" ]]; then
              echo "Release notes not found: $notes" >&2
              exit 1
            fi

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$tag" \
                --notes-file "$notes"
            elif [[ "$create" == true ]]; then
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "$tag" \
                --notes-file "$notes"
            else
              echo "Skipping $notes: release $tag has not been created yet"
            fi
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            publish_notes "$INPUT_TAG" true
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- releases/)"
            while IFS= read -r path; do
              [[ "$path" =~ ^releases/(v[0-9]+\.[0-9]+\.[0-9]+)\.md$ ]] || continue
              publish_notes "${BASH_REMATCH[1]}" false
            done <<< "$changed"
          else
            tag="$GITHUB_REF_NAME"
            publish_notes "$tag" true
          fi
